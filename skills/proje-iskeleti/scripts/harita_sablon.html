<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · harita</title>
<style>
:root{--bg:#f7f7f5;--fg:#2c2c2a;--muted:#5f5e5a;--line:#b4b2a9;--block:#ba7517;--panel:#ffffff;--border:#d3d1c7;
--spec:#7f77dd;--done:#1d9e75;--front:#ef9f27;--claimed:#378add;--blocked:#888780;--out:#d3d1c7}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1a;--fg:#e8e6df;--muted:#b4b2a9;--line:#5f5e5a;--block:#ef9f27;--panel:#262624;--border:#444441;--out:#5f5e5a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;border-bottom:1px solid var(--border)}
h1{font-size:17px;font-weight:600;margin:0}
.st{font-size:13px;color:var(--muted)}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.lg span{display:inline-flex;align-items:center;gap:5px}
.lg i{width:10px;height:10px;border-radius:50%;display:inline-block}
main{flex:1;position:relative;min-height:0}
svg{width:100%;height:100%;display:block;cursor:grab}
svg text{font-size:11px;fill:var(--muted);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
#info{position:absolute;left:12px;bottom:12px;max-width:min(460px,calc(100% - 24px));background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;opacity:.95}
#info b{display:block;margin-bottom:2px}
#info a{color:var(--spec)}
footer{font-size:12px;color:var(--muted);padding:6px 16px;border-top:1px solid var(--border)}
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <span class="st">Harita durumu: <b>__STATUS__</b></span>
  <div class="lg">
    <span><i style="background:var(--spec)"></i>spec</span>
    <span><i style="background:var(--done)"></i>kapalı</span>
    <span><i style="background:var(--front)"></i>çalışılabilir</span>
    <span><i style="background:var(--claimed)"></i>sahiplenilmiş</span>
    <span><i style="background:var(--blocked)"></i>bloklu</span>
    <span><i style="border:1px dashed var(--blocked)"></i>sis</span>
    <span><i style="background:var(--out)"></i>kapsam dışı</span>
    <span><i style="background:var(--block);border-radius:0;height:2px;width:14px"></i>Blocked by</span>
  </div>
</header>
<main>
  <svg id="g"></svg>
  <div id="info">Üzerine gel: bağlar · tıkla: dosya · çift tıkla: sığdır</div>
</main>
<footer>harita_ciz.py ile üretildi; elle düzenleme. Kaynaklar: ticket dosyaları, map.md, docs/spec.md.</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const DATA = __DATA__;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fill = t => t === 'fog' ? 'none' : css('--' + t);
const el = document.getElementById('g');
const W = el.clientWidth, H = el.clientHeight;
const svg = d3.select(el).attr('viewBox', [0, 0, W, H]);
svg.append('defs').append('marker').attr('id', 'ah').attr('viewBox', '0 0 10 10')
  .attr('refX', 9).attr('refY', 5).attr('markerWidth', 7).attr('markerHeight', 7).attr('orient', 'auto')
  .append('path').attr('d', 'M2 1L8 5L2 9').attr('fill', 'none').attr('stroke', css('--block')).attr('stroke-width', 1.5);
const z = svg.append('g');
const zoom = d3.zoom().scaleExtent([0.3, 4]).on('zoom', e => z.attr('transform', e.transform));
svg.call(zoom);
let fitted = false;
function fit() {
  const b = z.node().getBBox();
  if (!b.width || !b.height) return;
  const k = Math.min(1.6, 0.9 * Math.min(W / b.width, H / b.height));
  svg.transition().duration(400).call(zoom.transform,
    d3.zoomIdentity.translate(W / 2 - k * (b.x + b.width / 2), H / 2 - k * (b.y + b.height / 2)).scale(k));
}
const nodes = DATA.nodes, links = DATA.links;
const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id).distance(l => l.k ? 95 : 65).strength(l => l.k ? 0.9 : 0.45))
  .force('charge', d3.forceManyBody().strength(-280))
  .force('center', d3.forceCenter(W / 2, H / 2))
  .force('collide', d3.forceCollide(d => d.r + 16));
const link = z.append('g').selectAll('line').data(links).join('line')
  .attr('stroke', l => l.k ? css('--block') : css('--line'))
  .attr('stroke-width', l => l.k ? 1.7 : 0.8)
  .attr('marker-end', l => l.k ? 'url(#ah)' : null);
const node = z.append('g').selectAll('circle').data(nodes).join('circle')
  .attr('r', d => d.r).attr('fill', d => fill(d.t))
  .attr('stroke', d => d.t === 'fog' ? css('--blocked') : css('--bg'))
  .attr('stroke-width', d => d.t === 'fog' ? 1.2 : 1.5)
  .attr('stroke-dasharray', d => d.t === 'fog' ? '3 2' : null)
  .style('cursor', d => d.href ? 'pointer' : 'grab')
  .call(d3.drag()
    .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
const label = z.append('g').selectAll('text').data(nodes).join('text').text(d => d.l).attr('dx', d => d.r + 4).attr('dy', 4);
const nb = new Map(nodes.map(n => [n.id, new Set([n.id])]));
links.forEach(l => { nb.get(l.source.id).add(l.target.id); nb.get(l.target.id).add(l.source.id); });
const info = document.getElementById('info');
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
node.on('mouseover', (e, d) => {
  const s = nb.get(d.id);
  node.attr('opacity', n => s.has(n.id) ? 1 : 0.12);
  label.attr('opacity', n => s.has(n.id) ? 1 : 0.12);
  link.attr('opacity', l => l.source.id === d.id || l.target.id === d.id ? 1 : 0.06);
  info.innerHTML = '<b>' + esc(d.l) + '</b>' + esc(d.d || '') + (d.href ? ' · <a href="' + esc(d.href) + '">dosyayı aç</a>' : '');
}).on('mouseout', () => { node.attr('opacity', 1); label.attr('opacity', 1); link.attr('opacity', 1); })
  .on('click', (e, d) => { if (d.href) window.open(d.href, '_blank'); });
sim.on('tick', () => {
  link.each(function (l) {
    const dx = l.target.x - l.source.x, dy = l.target.y - l.source.y, len = Math.hypot(dx, dy) || 1;
    const pad = l.k ? l.target.r + 3 : 0;
    d3.select(this).attr('x1', l.source.x).attr('y1', l.source.y)
      .attr('x2', l.target.x - dx / len * pad).attr('y2', l.target.y - dy / len * pad);
  });
  node.attr('cx', d => d.x).attr('cy', d => d.y);
  label.attr('x', d => d.x).attr('y', d => d.y);
});
sim.on('end', () => { if (!fitted) { fitted = true; fit(); } });
svg.on('dblclick.zoom', null).on('dblclick', fit);
</script>
</body>
</html>
